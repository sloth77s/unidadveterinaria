  - generic [ref=f11e190]:
    - generic [ref=f11e191]:
      - generic [ref=f11e192]: Preguntas Frecuentes
      - heading "¿Tienes Dudas?" [level=2] [ref=f11e193]
    - generic [ref=f11e194]:
      - generic [ref=f11e195]:
        - button "¿Cuáles son los horarios de atención?" [ref=f11e196] [cursor=pointer]
        - paragraph [ref=f11e200]: Nuestra UCI funciona las 24 horas del día, los 365 días del año. La consulta general y especializada tiene horarios de lunes a sábado de 8:00 AM a 6:00 PM. Las emergencias están disponibles siempre.
      - generic [ref=f11e201]:
        - button "¿Necesito cita previa para emergencias?" [ref=f11e202] [cursor=pointer]
        - paragraph [ref=f11e206]: No. Las emergencias no requieren cita previa. Puede presentarse directamente con su mascota. Para consultas especializadas, le recomendamos agendar cita por WhatsApp para garantizar la disponibilidad del especialista.
      - generic [ref=f11e207]:
        - button "¿Qué especies atienden?" [ref=f11e208] [cursor=pointer]
        - paragraph [ref=f11e212]: Atendemos principalmente mascotas (perros y gatos), pero también contamos con experiencia en animales exóticos y de compañía. Consulte por disponibilidad para otras especies.
      - generic [ref=f11e213]:
        - button "¿Cómo puedo agendar una cita?" [ref=f11e214] [cursor=pointer]
        - paragraph [ref=f11e218]: La forma más rápida es a través de WhatsApp. Envíe un mensaje con su nombre, el nombre de su mascota y el motivo de la consulta. También puede llamarnos directamente o visitarnos en nuestra ubicación en Villavicencio.
      - generic [ref=f11e219]:
        - button "¿Aceptan seguros de mascotas?" [ref=f11e220] [cursor=pointer]
        - paragraph [ref=f11e224]: Trabajamos con diferentes aseguradoras de mascotas. Consulte directamente con nosotros para verificar si su seguro está cubierto. También ofrecemos opciones de pago flexibles.
