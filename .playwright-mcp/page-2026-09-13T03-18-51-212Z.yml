      - generic [ref=e192]: Preguntas Frecuentes
      - heading "¿Tienes Dudas?" [level=2] [ref=e193]
    - generic [ref=e194]:
      - generic [ref=e195]:
        - button "¿Cuáles son los horarios de atención?" [ref=e196] [cursor=pointer]
        - paragraph [ref=e200]: Nuestra UCI funciona las 24 horas del día, los 365 días del año. La consulta general y especializada tiene horarios de lunes a sábado de 8:00 AM a 6:00 PM. Las emergencias están disponibles siempre.
      - generic [ref=e201]:
        - button "¿Necesito cita previa para emergencias?" [ref=e202] [cursor=pointer]
        - paragraph [ref=e206]: No. Las emergencias no requieren cita previa. Puede presentarse directamente con su mascota. Para consultas especializadas, le recomendamos agendar cita por WhatsApp para garantizar la disponibilidad del especialista.
      - generic [ref=e207]:
        - button "¿Qué especies atienden?" [ref=e208] [cursor=pointer]
        - paragraph [ref=e212]: Atendemos principalmente mascotas (perros y gatos), pero también contamos con experiencia en animales exóticos y de compañía. Consulte por disponibilidad para otras especies.
      - generic [ref=e213]:
        - button "¿Cómo puedo agendar una cita?" [ref=e214] [cursor=pointer]
        - paragraph [ref=e218]: La forma más rápida es a través de WhatsApp. Envíe un mensaje con su nombre, el nombre de su mascota y el motivo de la consulta. También puede llamarnos directamente o visitarnos en nuestra ubicación en Villavicencio.
      - generic [ref=e219]:
        - button "¿Aceptan seguros de mascotas?" [ref=e220] [cursor=pointer]
        - paragraph [ref=e224]: Trabajamos con diferentes aseguradoras de mascotas. Consulte directamente con nosotros para verificar si su seguro está cubierto. También ofrecemos opciones de pago flexibles.
